<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/*  Parámetros y olas (compartidos entre shader y física)             */
/* ------------------------------------------------------------------ */
const G = 9.81, NW = 6;
const BASE_L = [64, 33, 18, 9.5, 5.2, 3.0];
const BASE_A = [0.55, 0.28, 0.14, 0.07, 0.035, 0.015];
const OFFS   = [0, 0.42, -0.55, 0.9, -1.15, 1.5];
const WK = BASE_L.map(L => 2 * Math.PI / L);
const WW = WK.map(k => Math.sqrt(G * k));
const DEF = { wind: 0.5, height: 1.0, chop: 0.6, dir: 20, hour: 17, foam: 0.8 };
const P = { ...DEF }, T = { ...DEF };

const uK = Float32Array.from(WK), uW = Float32Array.from(WW);
const uA = new Float32Array(NW), uB = new Float32Array(NW), uDx = new Float32Array(NW), uDz = new Float32Array(NW);
const waveMisc = { sumKB: 0.1, hNorm: 1, foamThr: 0.8 };
let driftX = 0, driftZ = 0;

function updateWaves() {
  const amp = P.height * (0.4 + 0.8 * P.wind);
  const a = [];
  let sumKA = 0;
  for (let i = 0; i < NW; i++) {
    const wgt = i < 3 ? 1 : (0.3 + 1.4 * P.wind);
    a[i] = BASE_A[i] * amp * wgt;
    sumKA += WK[i] * a[i];
  }
  if (sumKA > 0.9) { const s = 0.9 / sumKA; for (let i = 0; i < NW; i++) a[i] *= s; sumKA = 0.9; }
  const c = Math.min(P.chop * 1.3, 0.85 / Math.max(sumKA, 1e-4));
  let hn = 0;
  const a0 = P.dir * Math.PI / 180;
  for (let i = 0; i < NW; i++) {
    uA[i] = a[i]; uB[i] = c * a[i]; hn += a[i];
    uDx[i] = Math.cos(a0 + OFFS[i]); uDz[i] = Math.sin(a0 + OFFS[i]);
  }
  const sumKB = c * sumKA;
  waveMisc.sumKB = sumKB; waveMisc.hNorm = Math.max(hn, 1e-3);
  const sea = Math.min(sumKB / 0.6, 1);
  waveMisc.foamThr = Math.max(0.2, 1 - P.foam * (0.15 + 0.6 * sea));
  driftX = Math.cos(a0) * P.wind * 0.9; driftZ = Math.sin(a0) * P.wind * 0.9;
}
updateWaves();

/** Altura y velocidad del agua en (x,z) — mismo modelo que el vertex shader */
function sample(x, z, t, o) {
  let px = x, pz = z;
  for (let it = 0; it < 3; it++) {
    let dx = 0, dz = 0;
    for (let i = 0; i < NW; i++) {
      const th = uK[i] * (uDx[i] * px + uDz[i] * pz) - uW[i] * t;
      const c = Math.cos(th) * uB[i];
      dx += uDx[i] * c; dz += uDz[i] * c;
    }
    px = x - dx; pz = z - dz;
  }
  let h = 0, vx = 0, vz = 0, vy = 0;
  for (let i = 0; i < NW; i++) {
    const th = uK[i] * (uDx[i] * px + uDz[i] * pz) - uW[i] * t;
    const s = Math.sin(th), c = Math.cos(th);
    h += uA[i] * s; vy -= uW[i] * uA[i] * c;
    const q = uW[i] * uB[i] * s; vx += uDx[i] * q; vz += uDz[i] * q;
  }
  o.h = h; o.vy = vy; o.vx = vx + driftX; o.vz = vz + driftZ;
  return o;
}

/* ------------------------------------------------------------------ */
/*  Renderer / escena                                                  */
/* ------------------------------------------------------------------ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('err').style.display = 'flex';
  throw e;
}
const dom = renderer.domElement;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, innerWidth < 800 ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.prepend(dom);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(9, 2.8, 6);

/* ---------------- Uniforms compartidos cielo/océano ---------------- */
const V3 = THREE.Vector3;
const skyU = {
  uTime: { value: 0 },
  uSunDir: { value: new V3(0, 1, 0) }, uSunCol: { value: new V3(1, 1, 1) },
  uMoonDir: { value: new V3(0, -1, 0) }, uMoonCol: { value: new V3(0, 0, 0) },
  uDay: { value: 1 }, uDusk: { value: 0 }
};

const SKY_GLSL = /* glsl */`
uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uMoonDir; uniform vec3 uMoonCol;
uniform float uDay; uniform float uDusk;
float hash21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
float fbm3(vec2 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
vec3 skyColor(vec3 d, float disc){
  float h=clamp(d.y,0.,1.);
  float sd=max(dot(d,uSunDir),0.);
  vec3 zen=mix(vec3(0.005,0.01,0.04), vec3(0.09,0.27,0.70), uDay);
  zen=mix(zen, vec3(0.06,0.09,0.26), uDusk*0.7);
  vec3 hor=mix(vec3(0.02,0.035,0.08), vec3(0.55,0.72,0.92), uDay);
  hor=mix(hor, vec3(1.0,0.42,0.17), uDusk*(0.25+0.75*pow(sd,2.)));
  vec3 col=mix(hor,zen,pow(h,0.5));
  float night=(1.-uDay); night*=night;
  if(night>0.02 && d.y>0.0){
    vec2 uv=d.xz/(d.y+0.25)*55.; vec2 c=floor(uv); vec2 f=fract(uv)-0.5;
    vec2 off=(vec2(hash21(c+1.7),hash21(c+9.2))-0.5)*0.6;
    float s=step(0.93,hash21(c))*smoothstep(0.12,0.0,length(f-off));
    col+=vec3(0.8,0.85,1.)*s*night*smoothstep(0.0,0.25,d.y)*1.5;
  }
  if(d.y>0.005){
    vec2 uv=d.xz/(h+0.22)*0.9+vec2(uTime*0.006,uTime*0.002);
    float c=fbm3(uv*1.4);
    float cov=smoothstep(0.48,0.72,c)*smoothstep(0.0,0.18,h)*0.9;
    vec3 cc=mix(vec3(0.05,0.06,0.09),vec3(1.0,0.97,0.95),uDay);
    cc=mix(cc,hor*1.4+0.15,uDusk*0.6);
    cc+=uSunCol*pow(sd,5.)*0.35;
    col=mix(col,cc,cov);
  }
  float vis=smoothstep(-0.02,0.03,d.y);
  col+=uSunCol*(smoothstep(0.9996,0.9999,sd)*disc*25.*vis+pow(sd,8.)*0.15+pow(sd,200.)*0.5);
  float md=max(dot(d,uMoonDir),0.);
  col+=uMoonCol*(smoothstep(0.9993,0.9997,md)*disc*3.*vis+pow(md,200.)*0.2);
  return col;
}
`;

/* ---------------- Cielo (domo) ---------------- */
const skyMatArgs = () => ({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vDir;` + SKY_GLSL + `
    void main(){ vec3 d=normalize(vDir); vec3 col=skyColor(d,1.0);
      col+=(hash21(gl_FragCoord.xy)-0.5)/160.;
      gl_FragColor=vec4(col,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const domeGeo = new THREE.SphereGeometry(1, 48, 24);
const dome = new THREE.Mesh(domeGeo, new THREE.ShaderMaterial(skyMatArgs()));
dome.scale.setScalar(1500); dome.renderOrder = -10; dome.frustumCulled = false;
scene.add(dome);
const envScene = new THREE.Scene();
const envDome = new THREE.Mesh(domeGeo, new THREE.ShaderMaterial(skyMatArgs()));
envDome.scale.setScalar(50);
envScene.add(envDome);

/* ---------------- Océano ---------------- */
function buildOceanGeometry() {
  const N = 320, R = 500;
  const pos = new Float32Array((N + 1) * (N + 1) * 3);
  let o = 0;
  for (let j = 0; j <= N; j++) {
    const v = -1 + 2 * j / N, z = R * (0.15 * v + 0.85 * v * v * v);
    for (let i = 0; i <= N; i++) {
      const u = -1 + 2 * i / N;
      pos[o++] = R * (0.15 * u + 0.85 * u * u * u); pos[o++] = 0; pos[o++] = z;
    }
  }
  const idx = new Uint32Array(N * N * 6);
  let k = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

const objU = Array.from({ length: 5 }, () => new THREE.Vector4(0, 0, 0, 0));
const oceanU = {
  ...skyU,
  uCenter: { value: new V3() },
  uK: { value: uK }, uA: { value: uA }, uB: { value: uB }, uDx: { value: uDx }, uDz: { value: uDz }, uW: { value: uW },
  uSumKB: { value: 0.1 }, uHeightNorm: { value: 1 }, uFoamThr: { value: 0.8 },
  uWind: { value: 0.5 }, uObj: { value: objU }
};

const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanU,
  vertexShader: /* glsl */`
    uniform float uTime; uniform vec3 uCenter;
    uniform float uK[6]; uniform float uA[6]; uniform float uB[6]; uniform float uDx[6]; uniform float uDz[6]; uniform float uW[6];
    uniform float uSumKB;
    varying vec3 vWorld; varying vec3 vN; varying float vFoam; varying float vH;
    void main(){
      vec2 p0=position.xz+uCenter.xz;
      float dist=length(p0-cameraPosition.xz);
      float fd=1.-smoothstep(80.,260.,dist);
      vec2 disp=vec2(0.); float dy=0.; vec2 gr=vec2(0.); float ny=0.;
      for(int i=0;i<6;i++){
        float f = i>=3 ? fd : 1.;
        vec2 D=vec2(uDx[i],uDz[i]);
        float th=uK[i]*dot(D,p0)-uW[i]*uTime;
        float s=sin(th), c=cos(th);
        float a=uA[i]*f, b=uB[i]*f;
        disp+=D*b*c; dy+=a*s; gr+=D*uK[i]*a*c; ny+=uK[i]*b*s;
      }
      vec3 wp=vec3(p0.x+disp.x, dy, p0.y+disp.y);
      vN=normalize(vec3(-gr.x, 1.-ny, -gr.y));
      vFoam=ny/max(uSumKB,0.02);
      vWorld=wp; vH=dy;
      gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.);
    }`,
  fragmentShader: `
    varying vec3 vWorld; varying vec3 vN; varying float vFoam; varying float vH;
    uniform float uHeightNorm; uniform float uFoamThr; uniform float uWind; uniform vec4 uObj[5];
    ` + SKY_GLSL + /* glsl */`
    float fb2(vec2 p){ return vnoise(p)+0.5*vnoise(p*2.1); }
    vec2 fbmGrad(vec2 p){ float e=0.1; float n0=fb2(p); return vec2(fb2(p+vec2(e,0.))-n0, fb2(p+vec2(0.,e))-n0)/e; }
    void main(){
      vec3 V=normalize(cameraPosition-vWorld);
      float dist=length(cameraPosition-vWorld);
      vec3 N=normalize(vN);
      float lod=1./(1.+dist*0.025);
      float amp=(0.025+0.11*uWind)*lod;
      vec2 q=vWorld.xz;
      vec2 g1=fbmGrad(q*1.1+vec2(uTime*0.35,uTime*0.12));
      vec2 g2=fbmGrad(q*2.7-vec2(uTime*0.22,-uTime*0.4));
      N=normalize(N+vec3(-(g1.x+0.6*g2.x),0.,-(g1.y+0.6*g2.y))*amp);
      float nv=max(dot(N,V),0.001);
      float F=0.02+0.98*pow(1.-nv,5.);
      vec3 R=reflect(-V,N); R.y=abs(R.y);
      vec3 refl=skyColor(R,0.0);
      float hn=vH/uHeightNorm;
      vec3 deep=vec3(0.004,0.035,0.06), shallow=vec3(0.02,0.16,0.17);
      vec3 body=mix(deep,shallow,smoothstep(-0.8,1.0,hn))*(0.15+0.85*uDay);
      vec2 sh=normalize(uSunDir.xz+1e-4), vh=normalize(V.xz+1e-4);
      float back=max(dot(vh,-sh),0.);
      float crest=smoothstep(0.1,1.0,hn);
      vec3 sss=vec3(0.02,0.30,0.22)*crest*(0.3+back*back*1.5)*uDay;
      vec3 col=mix(body+sss,refl,F);
      float sp=max(dot(R,uSunDir),0.);
      col+=uSunCol*(pow(sp,900.)*60.+pow(sp,70.)*0.35)*step(0.,uSunDir.y+0.05);
      float mp=max(dot(R,uMoonDir),0.);
      col+=uMoonCol*(pow(mp,700.)*30.+pow(mp,60.)*0.3);
      // espuma
      float fm=smoothstep(uFoamThr,uFoamThr+0.2,vFoam);
      float tex=fbm3(q*2.2+vec2(uTime*0.05));
      float tex2=vnoise(q*7.+uTime*0.2);
      float foam=fm*smoothstep(0.25,0.75,tex*0.8+tex2*0.5);
      for(int i=0;i<5;i++){
        vec4 o=uObj[i];
        if(o.z>0.){
          float d=length(vWorld.xz-o.xy);
          float ring=1.-smoothstep(o.z*0.9,o.z*1.8+0.25,d);
          foam+=ring*(0.35+0.65*vnoise(q*5.-uTime*0.5))*0.7;
        }
      }
      foam=clamp(foam,0.,1.)*(1.-smoothstep(150.,350.,dist));
      float lit=0.12+0.88*uDay;
      vec3 foamCol=vec3(0.9,0.94,1.0)*lit*mix(vec3(1.),uSunCol*1.1+0.1,0.5*uDay);
      col=mix(col,foamCol,foam*0.9);
      // niebla atmosférica
      float fd=length(vWorld.xz-cameraPosition.xz);
      float fog=1.-exp(-pow(fd*0.0055,2.));
      vec3 fdir=normalize(vec3(-V.x,0.,-V.z)+vec3(0.,0.04,0.));
      col=mix(col,skyColor(fdir,0.0),fog);
      gl_FragColor=vec4(col,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const ocean = new THREE.Mesh(buildOceanGeometry(), oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);

/* ---------------- Luces / entorno ---------------- */
const sunLight = new THREE.DirectionalLight(0xffffff, 2);
const moonLight = new THREE.DirectionalLight(0x8fa8ff, 0);
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x143040, 0.2);
scene.add(sunLight, moonLight, hemi);

const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, envDirty = true, lastEnv = 0;
function rebuildEnv() {
  const rt = pmrem.fromScene(envScene, 0, 0.1, 100);
  if (envRT) envRT.dispose();
  envRT = rt; scene.environment = rt.texture;
}

const sm = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
let lastHour = null;
function updateSky() {
  if (P.hour === lastHour) return;
  lastHour = P.hour;
  const a = (P.hour - 6) / 12 * Math.PI;
  const sun = new V3(Math.cos(a), Math.sin(a) * 0.92, -0.38).normalize();
  const el = sun.y;
  const day = sm(-0.12, 0.35, el);
  skyU.uDay.value = day;
  skyU.uDusk.value = Math.exp(-Math.pow(el / 0.25, 2));
  skyU.uSunDir.value.copy(sun);
  const w = sm(0.02, 0.45, el);
  const sunI = sm(-0.06, 0.12, el);
  skyU.uSunCol.value.set(1.0 + (1.0 - 1.0) * w, 0.5 + 0.43 * w, 0.22 + 0.60 * w).multiplyScalar(sunI);
  const moon = sun.clone().negate();
  skyU.uMoonDir.value.copy(moon);
  const moonI = 0.4 * (1 - day) * sm(-0.1, 0.15, moon.y);
  skyU.uMoonCol.value.set(0.55, 0.65, 0.9).multiplyScalar(moonI);
  sunLight.position.copy(sun).multiplyScalar(100);
  sunLight.color.setRGB(skyU.uSunCol.value.x / Math.max(sunI, 1e-3), skyU.uSunCol.value.y / Math.max(sunI, 1e-3), skyU.uSunCol.value.z / Math.max(sunI, 1e-3));
  sunLight.intensity = 2.8 * sunI;
  moonLight.position.copy(moon).multiplyScalar(100);
  moonLight.intensity = 1.6 * moonI;
  hemi.intensity = 0.1 + 0.25 * day;
  partMat.color.setScalar(0.3 + 0.7 * day);
  envDirty = true;
}

/* ------------------------------------------------------------------ */
/*  Modelos: pato de goma y boya                                       */
/* ------------------------------------------------------------------ */
function makeDuck() {
  const g = new THREE.Group();
  const yellow = new THREE.MeshStandardMaterial({ color: 0xffcf1a, roughness: 0.28, metalness: 0, emissive: 0xff9a00, emissiveIntensity: 0 });
  const darker = new THREE.MeshStandardMaterial({ color: 0xffbd00, roughness: 0.3, emissive: 0xff9a00, emissiveIntensity: 0 });
  const orange = new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.35, emissive: 0xff9a00, emissiveIntensity: 0 });
  const black = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.15 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const sph = (r, mat, sx, sy, sz, x, y, z, parent) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z); (parent || g).add(m); return m;
  };
  sph(0.5, yellow, 1.0, 0.82, 1.2, 0, 0, 0);
  const head = new THREE.Group(); head.position.set(0, 0.56, 0.3); g.add(head);
  sph(0.3, yellow, 1, 1, 1, 0, 0, 0, head);

let actx = null, master = null, seaGain = null, seaLP = null, muted = false;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;

    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;

    seaGain = actx.createGain(); seaGain.gain.value = 0;

  } catch (e) { actx = null; }
}
function updateAudio() {
  if (!actx || !seaGain) return;
  const t = actx.currentTime;
  seaGain.gain.setTargetAtTime(0.05 + 0.3 * (P.wind * 0.6 + P.height / 2.5 * 0.4), t, 0.3);
  seaLP.frequency.setTargetAtTime(300 + 900 * P.wind, t, 0.3);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  simT += dt;

  const ks = 1 - Math.exp(-dt * 3.5);
  for (const key in P) P[key] += (T[key] - P[key]) * ks;
  updateWaves(); updateSky(); updateAudio();
  skyU.uTime.value = simT;
  oceanU.uSumKB.value = waveMisc.sumKB; oceanU.uHeightNorm.value = waveMisc.hNorm;
  oceanU.uFoamThr.value = waveMisc.foamThr; oceanU.uWind.value = P.wind;

  // objetivo del arrastre
  if (drag) {
    ray.setFromCamera(ndc, camera);
    plane.set(_up.set(0, 1, 0), -(drag.f.lastH + 0.15));
    if (ray.ray.intersectPlane(plane, _hit) && _hit.distanceTo(camera.position) < 150) drag.f.grabTarget.copy(_hit);
  }

  // física con subpasos
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let s = 0; s < n; s++) {
    for (let i = 0; i < floaters.length; i++) for (let j = i + 1; j < floaters.length; j++) {
      const a = floaters[i], b = floaters[j];
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), md = a.radius + b.radius;
      if (d < md && d > 1e-4) {
        const f = 30 * (md - d) * Math.min(a.m, b.m) / d;
        a.extra.x -= f * dx; a.extra.z -= f * dz; b.extra.x += f * dx; b.extra.z += f * dz;
      }
    }
    const tt = simT - dt + h * (s + 1);
    for (const f of floaters) f.step(h, tt);
  }
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i]; f.syncVisual(simT);
    objU[i].set(f.pos.x, f.pos.z, f.sub > 0 || f.pos.y < f.lastH + 0.5 ? f.radius : 0, 1);
  }
  const lamp = buoy1.model.userData.lamp, lamp2 = buoy2.model.userData.lamp;
  const night = 1 - skyU.uDay.value;
  lamp.emissiveIntensity = 0.3 + Math.max(0, Math.sin(simT * 3)) * 2.5 * night;
  lamp2.emissiveIntensity = 0.3 + Math.max(0, Math.sin(simT * 3 + 2)) * 2.5 * night;
  updateParticles(dt);

  // cámara sigue suavemente al pato (salvo al arrastrar)
  if (!drag) {
    const fx = 1 - Math.exp(-dt * 2.5), fy = 1 - Math.exp(-dt * 2);
    smoothY += (mainDuck.pos.y * 0.35 - smoothY) * fy;
    newTarget.set(controls.target.x + (mainDuck.pos.x - controls.target.x) * fx, smoothY, controls.target.z + (mainDuck.pos.z - controls.target.z) * fx);
    camDelta.subVectors(newTarget, controls.target);
    controls.target.add(camDelta); camera.position.add(camDelta);
  }
  controls.update();
  sample(camera.position.x, camera.position.z, simT, _S2);
  const minY = _S2.h + 0.7;
  if (camera.position.y < minY) camera.position.y = minY;
  dome.position.copy(camera.position);
  oceanU.uCenter.value.set(controls.target.x, 0, controls.target.z);

  if (envDirty && now - lastEnv > 400) { rebuildEnv(); envDirty = false; lastEnv = now; }
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
dom.addEventListener('webglcontextlost', e => e.preventDefault());

updateSky(); rebuildEnv(); envDirty = false; lastEnv = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
