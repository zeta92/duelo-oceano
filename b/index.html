<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Océano 3D &amp; Pato de Goma</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🦆</text></svg>" />
  <style>
    :root {
      --panel-bg: rgba(12, 22, 34, 0.62);
      --panel-border: rgba(255, 255, 255, 0.16);
      --text-main: #f4f8fc;
      --text-muted: rgba(226, 238, 248, 0.74);
      --accent: #ffbe2e;
      --accent-2: #4dd4e8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 20;
      width: min(310px, calc(100vw - 28px));
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
      touch-action: manipulation;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hud-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(255, 190, 46, 0.75);
      flex-shrink: 0;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 9px;
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.active {
      background: rgba(77, 212, 232, 0.22);
      border-color: rgba(77, 212, 232, 0.65);
      color: #c9f7ff;
    }

    .hud-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hud.collapsed .hud-body {
      display: none;
    }

    .hud.collapsed .hud-header {
      border-bottom: none;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .control-value {
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      font-weight: 700;
      font-size: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
      touch-action: pan-x;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }

    input[type="range"]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .hud-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: var(--text-muted);
    }

    .hint-pill {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(10, 20, 32, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      color: rgba(244, 248, 252, 0.88);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .hint-pill.hidden {
      opacity: 0;
    }

    @media (max-width: 600px) {
      .hud {
        width: min(275px, calc(100vw - 24px));
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
      }
      .hud-body {
        padding: 10px 12px 12px;
        gap: 9px;
      }
      .hint-pill {
        font-size: 11px;
        padding: 7px 12px;
        max-width: calc(100vw - 24px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <aside class="hud" id="hud">
    <div class="hud-header">
      <div class="hud-title-wrap">
        <span class="hud-dot"></span>
        <span class="hud-title">Control del Océano</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="btn-sound" title="Activar/silenciar sonido" aria-label="Sonido">🔇</button>
        <button class="icon-btn" id="btn-center" title="Centrar pato y cámara" aria-label="Centrar">🦆</button>
        <button class="icon-btn" id="btn-toggle" title="Mostrar u ocultar controles" aria-label="Plegar">▾</button>
      </div>
    </div>

    <div class="hud-body" id="hud-body">
      <div class="control-row">
        <div class="control-label">
          <span>Fuerza del viento</span>
          <span class="control-value" id="val-wind">12 nudos</span>
        </div>
        <input type="range" id="ctrl-wind" min="0" max="1" step="0.01" value="0.42" />
      </div>

      <div class="control-row">
        <div class="control-label">
          <span>Altura del oleaje</span>
          <span class="control-value" id="val-height">1.15 m</span>
        </div>
        <input type="range" id="ctrl-height" min="0.08" max="2.8" step="0.02" value="1.15" />
      </div>

      <div class="control-row">
        <div class="control-label">
          <span>Picado y espuma</span>
          <span class="control-value" id="val-chop">52%</span>
        </div>
        <input type="range" id="ctrl-chop" min="0" max="1" step="0.01" value="0.52" />
      </div>

      <div class="control-row">
        <div class="control-label">
          <span>Hora del día</span>
          <span class="control-value" id="val-time">17:45 · Atardecer</span>
        </div>
        <input type="range" id="ctrl-time" min="0" max="1" step="0.005" value="0.74" />
      </div>

      <div class="control-row">
        <div class="control-label">
          <span>Dirección del viento</span>
          <span class="control-value" id="val-dir">215° SO</span>
        </div>
        <input type="range" id="ctrl-dir" min="0" max="360" step="1" value="215" />
      </div>

      <div class="hud-footer">
        <span>Toca o arrastra el pato</span>
        <span>Orbita con 1 dedo / ratón</span>
      </div>
    </div>
  </aside>

  <div class="hint-pill" id="hint-pill">Pulsa el pato para hacerlo saltar · Arrástralo sobre las olas · Orbita la cámara</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================
    // 1. PARÁMETROS DE ESTADO Y CONTROLES UI
    // =========================================================
    const state = {
      wind: 0.42,          // 0..1 (fuerza del viento)
      waveHeight: 1.15,    // metros de amplitud base
      choppiness: 0.52,    // 0..1 (steepness + espuma)
      timeOfDay: 0.74,     // 0..1 (0 = medianoche, 0.25 = amanecer, 0.5 = mediodía, 0.75 = atardecer)
      windAngleDeg: 215,   // 0..360 grados
      wavePhase: 0,        // integral acumulada para no saltar fase al mover el viento
      elapsed: 0
    };

    const hudEl = document.getElementById('hud');
    const btnToggle = document.getElementById('btn-toggle');
    const btnSound = document.getElementById('btn-sound');
    const btnCenter = document.getElementById('btn-center');
    const hintPill = document.getElementById('hint-pill');

    const ctrlWind = document.getElementById('ctrl-wind');
    const ctrlHeight = document.getElementById('ctrl-height');
    const ctrlChop = document.getElementById('ctrl-chop');
    const ctrlTime = document.getElementById('ctrl-time');
    const ctrlDir = document.getElementById('ctrl-dir');

    const valWind = document.getElementById('val-wind');
    const valHeight = document.getElementById('val-height');
    const valChop = document.getElementById('val-chop');
    const valTime = document.getElementById('val-time');
    const valDir = document.getElementById('val-dir');

    // Evitar que los eventos en el panel interfieran con OrbitControls
    ['pointerdown', 'touchstart', 'wheel'].forEach(evt => {
      hudEl.addEventListener(evt, e => e.stopPropagation(), { passive: true });
    });

    btnToggle.addEventListener('click', () => {
      const collapsed = hudEl.classList.toggle('collapsed');
      btnToggle.textContent = collapsed ? '▸' : '▾';
    });

    function formatTimeLabel(t) {
      const totalMinutes = Math.round(t * 24 * 60) % (24 * 60);
      const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
      const mm = String(totalMinutes % 60).padStart(2, '0');
      let phase = 'Noche';
      if (t >= 0.21 && t < 0.32) phase = 'Amanecer';
      else if (t >= 0.32 && t < 0.68) phase = 'Día';
      else if (t >= 0.68 && t < 0.81) phase = 'Atardecer';
      return `${hh}:${mm} · ${phase}`;
    }

    function formatCompass(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      const idx = Math.round(((deg % 360) / 45)) % 8;
      return `${Math.round(deg)}° ${dirs[idx]}`;
    }

    function syncLabels() {
      const knots = Math.round(state.wind * 34);
      valWind.textContent = `${knots} nudos`;
      valHeight.textContent = `${state.waveHeight.toFixed(2)} m`;
      valChop.textContent = `${Math.round(state.choppiness * 100)}%`;
      valTime.textContent = formatTimeLabel(state.timeOfDay);
      valDir.textContent = formatCompass(state.windAngleDeg);
    }

    ctrlWind.addEventListener('input', e => {
      state.wind = parseFloat(e.target.value);
      syncLabels();
    });
    ctrlHeight.addEventListener('input', e => {
      state.waveHeight = parseFloat(e.target.value);
      syncLabels();
    });
    ctrlChop.addEventListener('input', e => {
      state.choppiness = parseFloat(e.target.value);
      syncLabels();
    });
    ctrlTime.addEventListener('input', e => {
      state.timeOfDay = parseFloat(e.target.value);
      syncLabels();
      updateAtmosphere();
    });
    ctrlDir.addEventListener('input', e => {
      state.windAngleDeg = parseFloat(e.target.value);
      syncLabels();
    });

    syncLabels();

    // Ocultar la pista tras unos segundos o al primer toque en canvas
    setTimeout(() => hintPill.classList.add('hidden'), 9000);

    // =========================================================
    // 2. AUDIO PROCEDURAL (WEB AUDIO API, SIN ARCHIVOS)
    // =========================================================
    const sound = {
      enabled: false,
      ctx: null,
      oceanGain: null,
      oceanFilter: null,
      lfoGain: null,

      toggle() {
        if (!this.ctx) this.init();
        this.enabled = !this.enabled;
        if (this.enabled && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (this.oceanGain) {
          this.oceanGain.gain.setTargetAtTime(this.enabled ? 0.14 : 0.0, this.ctx.currentTime, 0.18);
        }
        btnSound.textContent = this.enabled ? '🔊' : '🔇';
        btnSound.classList.toggle('active', this.enabled);
      },

      init() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();

        // Ruido rosa/marrón para el oleaje continuo
        const bufferSize = this.ctx.sampleRate * 3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + 0.035 * white) / 1.035;
          lastOut = data[i];
          data[i] *= 3.2;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        this.oceanFilter = this.ctx.createBiquadFilter();
        this.oceanFilter.type = 'lowpass';
        this.oceanFilter.frequency.value = 340;
        this.oceanFilter.Q.value = 0.7;

        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.17;
        this.lfoGain = this.ctx.createGain();
        this.lfoGain.gain.value = 180;
        lfo.connect(this.lfoGain);
        this.lfoGain.connect(this.oceanFilter.frequency);

        this.oceanGain = this.ctx.createGain();
        this.oceanGain.gain.value = 0;

        noise.connect(this.oceanFilter);
        this.oceanFilter.connect(this.oceanGain);
        this.oceanGain.connect(this.ctx.destination);

        noise.start();
        lfo.start();
      },

      update(wind, height) {
        if (!this.enabled || !this.ctx || !this.oceanFilter) return;
        const now = this.ctx.currentTime;
        const baseFreq = 210 + wind * 580 + height * 90;
        const targetGain = 0.06 + wind * 0.14 + Math.min(height / 2.8, 1) * 0.07;
        this.oceanFilter.frequency.setTargetAtTime(baseFreq, now, 0.2);
        this.oceanGain.gain.setTargetAtTime(targetGain, now, 0.2);
      },

      playSqueak() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc2.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.045);
        osc.frequency.exponentialRampToValueAtTime(590, now + 0.16);

        osc2.frequency.setValueAtTime(1320, now);
        osc2.frequency.exponentialRampToValueAtTime(1750, now + 0.05);
        osc2.frequency.exponentialRampToValueAtTime(1120, now + 0.16);

        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        filter.Q.value = 1.6;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc2.start(now);
        osc.stop(now + 0.19);
        osc2.stop(now + 0.19);
      },

      playSplash(intensity = 0.7) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const dur = 0.32;
        const len = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.28));
        }

        const src = this.ctx.createBufferSource();
        src.buffer = buf;

        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(950, now);
        bp.frequency.exponentialRampToValueAtTime(320, now + dur);
        bp.Q.value = 1.1;

        const g = this.ctx.createGain();
        const amp = Math.min(0.28, 0.07 + intensity * 0.18);
        g.gain.setValueAtTime(amp, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);

        src.connect(bp);
        bp.connect(g);
        g.connect(this.ctx.destination);
        src.start(now);
      }
    };

    btnSound.addEventListener('click', () => sound.toggle());

    // =========================================================
    // 3. ESCENA, CÁMARA, RENDERER Y ORBIT CONTROLS
    // =========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.15, 650);
    camera.position.set(5.4, 3.3, 7.6);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minDistance = 3.2;
    controls.maxDistance = 38.0;
    controls.minPolarAngle = 0.12;
    controls.maxPolarAngle = Math.PI * 0.482;
    controls.target.set(0, 0.45, 0);
    controls.update();

    // Iluminación principal
    const sunLight = new THREE.DirectionalLight(0xfff0d6, 2.8);
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x9bd2ff, 0x0b3a4a, 0.9);
    scene.add(hemiLight);

    const rimFill = new THREE.DirectionalLight(0x6ecbff, 0.45);
    rimFill.position.set(-10, 4, -12);
    scene.add(rimFill);

    // =========================================================
    // 4. CIELO PROCEDURAL Y ATMÓSFERA DINÁMICA
    // =========================================================
    const skyUniforms = {
      uSunDir: { value: new THREE.Vector3(0.4, 0.3, -0.8).normalize() },
      uZenithColor: { value: new THREE.Color(0x1f5ca8) },
      uHorizonColor: { value: new THREE.Color(0xf0b27a) },
      uSunColor: { value: new THREE.Color(0xffdfa8) },
      uNightFactor: { value: 0.0 },
      uTime: { value: 0.0 }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vWorldDir;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldDir = normalize(position);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uSunDir;
        uniform vec3 uZenithColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunColor;
        uniform float uNightFactor;
        uniform float uTime;
        varying vec3 vWorldDir;

        float hash(vec3 p) {
          p = fract(p * 0.3183099 + 0.1);
          p *= 17.0;
          return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }

        float noise3(vec3 x) {
          vec3 i = floor(x);
          vec3 f = fract(x);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
            mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
            f.z
          );
        }

        void main() {
          vec3 dir = normalize(vWorldDir);
          float elev = clamp(dir.y, -0.1, 1.0);
          float horizonMix = pow(1.0 - clamp(elev, 0.0, 1.0), 2.4);
          vec3 col = mix(uZenithColor, uHorizonColor, horizonMix);

          // Brillo atmosférico alrededor del sol / luna
          float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
          float halo = pow(sunDot, 7.0) * 0.45 + pow(sunDot, 48.0) * 0.65;
          float disc = smoothstep(0.9985, 0.9996, sunDot) * 4.5;
          col += uSunColor * (halo + disc);

          // Nubes suaves sutiles en la bóveda
          if (dir.y > 0.02) {
            vec2 uv = dir.xz / (dir.y + 0.22);
            float n = noise3(vec3(uv * 1.4 + vec2(uTime * 0.012, 0.0), 1.7));
            n += 0.5 * noise3(vec3(uv * 3.1 - vec2(uTime * 0.018, 0.0), 4.2));
            float cloud = smoothstep(0.78, 1.25, n) * smoothstep(0.02, 0.22, dir.y);
            vec3 cloudCol = mix(uHorizonColor * 1.18, uSunColor * 0.95, pow(sunDot, 3.0) * 0.65);
            cloudCol *= mix(1.0, 0.28, uNightFactor);
            col = mix(col, cloudCol, cloud * 0.36);
          }

          // Estrellas en la noche
          if (uNightFactor > 0.05 && dir.y > 0.0) {
            vec3 starGrid = floor(dir * 260.0);
            float starVal = hash(starGrid);
            if (starVal > 0.9965) {
              float twinkle = 0.65 + 0.35 * sin(uTime * 2.5 + starVal * 90.0);
              col += vec3(0.85, 0.92, 1.0) * twinkle * uNightFactor * smoothstep(0.0, 0.25, dir.y) * 1.3;
            }
          }

          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(320, 40, 24), skyMat);
    scene.add(skyMesh);

    // =========================================================
    // 5. MOTOR DE OLAS GERSTNER (SINCRONIZADO GPU <-> CPU)
    // =========================================================
    const NUM_WAVES = 6;
    const MAX_RIPPLES = 8;

    // Configuración base de cada tren de olas:
    // [offsetDeg, wavelength, baseAmpWeight, chopWeight]
    const WAVE_SPECS = [
      { offsetDeg:   0, wavelength: 26.0, ampW: 0.42, chopW: 0.55 },
      { offsetDeg:  24, wavelength: 16.5, ampW: 0.26, chopW: 0.72 },
      { offsetDeg: -31, wavelength: 10.8, ampW: 0.16, chopW: 0.85 },
      { offsetDeg:  44, wavelength:  6.4, ampW: 0.09, chopW: 1.05 },
      { offsetDeg: -52, wavelength:  3.8, ampW: 0.05, chopW: 1.15 },
      { offsetDeg:  14, wavelength:  2.2, ampW: 0.028, chopW: 1.25 }
    ];

    // Datos compactos compartidos entre CPU y GPU
    const waveData = Array.from({ length: NUM_WAVES }, () => ({
      dx: 1, dz: 0, amp: 0, k: 1, steepness: 0, speed: 1
    }));

    const uWaveDirAmp = Array.from({ length: NUM_WAVES }, () => new THREE.Vector4());
    const uWaveSteepSpeed = Array.from({ length: NUM_WAVES }, () => new THREE.Vector4());

    // Anillos de salpicadura/estela en el agua: (x, z, age, strength)
    const ripples = Array.from({ length: MAX_RIPPLES }, () => ({
      active: false, x: 0, z: 0, age: 0, strength: 0
    }));
    const uRipples = Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, 99, 0));
    let rippleCursor = 0;

    function spawnRipple(x, z, strength = 0.85) {
      const r = ripples[rippleCursor];
      rippleCursor = (rippleCursor + 1) % MAX_RIPPLES;
      r.active = true;
      r.x = x;
      r.z = z;
      r.age = 0;
      r.strength = Math.min(1.6, Math.max(0.15, strength));
    }

    function updateWaveParameters() {
      const windRad = (state.windAngleDeg * Math.PI) / 180;
      const windFactor = 0.35 + 1.15 * state.wind;
      const chopBase = 0.12 + 0.76 * state.choppiness;

      // Calculamos amplitudes y aseguramos suma(Q_i * k_i * A_i) <= 0.85 para cero auto-intersección
      let steepnessSum = 0;
      for (let i = 0; i < NUM_WAVES; i++) {
        const spec = WAVE_SPECS[i];
        const angle = windRad + (spec.offsetDeg * Math.PI) / 180;
        const dx = Math.cos(angle);
        const dz = Math.sin(angle);
        const k = (2 * Math.PI) / spec.wavelength;

        // Las olas cortas dependen más intensamente del viento
        const windScale = i < 3
          ? (0.62 + 0.50 * state.wind)
          : (0.20 + 1.35 * state.wind);

        const amp = state.waveHeight * spec.ampW * windScale;
        const speed = Math.sqrt(9.81 / k) * (0.7 + 0.45 * windFactor);

        // Steepness deseada antes de normalizar
        const rawQ = chopBase * spec.chopW / Math.max(0.001, k * amp * NUM_WAVES);
        const clampedQ = Math.min(rawQ, 0.82 / Math.max(0.001, k * amp * NUM_WAVES));

        waveData[i].dx = dx;
        waveData[i].dz = dz;
        waveData[i].amp = amp;
        waveData[i].k = k;
        waveData[i].steepness = clampedQ;
        waveData[i].speed = speed;

        steepnessSum += clampedQ * k * amp;
      }

      if (steepnessSum > 0.84) {
        const scale = 0.84 / steepnessSum;
        for (let i = 0; i < NUM_WAVES; i++) {
          waveData[i].steepness *= scale;
        }
      }

      for (let i = 0; i < NUM_WAVES; i++) {
        const w = waveData[i];
        uWaveDirAmp[i].set(w.dx, w.dz, w.amp, w.k);
        uWaveSteepSpeed[i].set(w.steepness, w.speed, 0, 0);
      }
    }

    // Evalúa el desplazamiento Gerstner exacto en un punto semilla (x0, z0)
    function evaluateGerstnerAtSeed(x0, z0, phase) {
      let px = x0;
      let pz = z0;
      let py = 0;
      let vx = 0;
      let vz = 0;
      let vy = 0;

      // Vectores tangentes para calcular la normal exacta
      let txX = 1, txY = 0, txZ = 0;
      let tzX = 0, tzY = 0, tzZ = 1;

      for (let i = 0; i < NUM_WAVES; i++) {
        const w = waveData[i];
        const theta = w.k * (w.dx * x0 + w.dz * z0) - w.speed * phase;
        const c = Math.cos(theta);
        const s = Math.sin(theta);

        const qa = w.steepness * w.amp;
        px += qa * w.dx * c;
        pz += qa * w.dz * c;
        py += w.amp * s;

        const omega = w.k * w.speed;
        vx += qa * w.dx * omega * s;
        vz += qa * w.dz * omega * s;
        vy -= w.amp * omega * c;

        const wa = w.k * w.amp;
        const qwa = w.steepness * wa;
        txX -= qwa * w.dx * w.dx * s;
        txY += wa * w.dx * c;
        txZ -= qwa * w.dx * w.dz * s;

        tzX -= qwa * w.dx * w.dz * s;
        tzY += wa * w.dz * c;
        tzZ -= qwa * w.dz * w.dz * s;
      }

      // Normal = cross(tz, tx)
      let nx = tzY * txZ - tzZ * txY;
      let ny = tzZ * txX - tzX * txZ;
      let nz = tzX * txY - tzY * txX;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;

      return { x: px, y: py, z: pz, nx, ny, nz, vx, vy, vz };
    }

    // Invierte el desplazamiento horizontal (2 iteraciones) para conocer la altura exacta en (worldX, worldZ)
    function sampleOceanSurface(worldX, worldZ, phase) {
      let sx = worldX;
      let sz = worldZ;
      let res = evaluateGerstnerAtSeed(sx, sz, phase);
      sx = worldX - (res.x - sx);
      sz = worldZ - (res.z - sz);
      res = evaluateGerstnerAtSeed(sx, sz, phase);
      sx = worldX - (res.x - sx);
      sz = worldZ - (res.z - sz);
      res = evaluateGerstnerAtSeed(sx, sz, phase);

      // Suma contribución vertical de anillos activos
      let rippleY = 0;
      for (let i = 0; i < MAX_RIPPLES; i++) {
        const r = ripples[i];
        if (!r.active) continue;
        const dx = worldX - r.x;
        const dz = worldZ - r.z;
        const dist = Math.hypot(dx, dz);
        const ringR = r.age * 5.0;
        const env = Math.exp(-Math.abs(dist - ringR) * 1.45) * Math.exp(-r.age * 1.25) * r.strength;
        rippleY += Math.sin((dist - ringR) * 4.6) * 0.14 * env;
      }

      res.y += rippleY;
      return res;
    }

    // =========================================================
    // 6. MALLA DE OCÉANO DE DENSIDAD ADAPTATIVA + SHADERS
    // =========================================================
    function buildOceanGeometry(size = 380, segments = 220) {
      const geo = new THREE.PlaneGeometry(1, 1, segments, segments);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const half = size * 0.5;
      // Distribución no lineal: muy densa cerca del pato (centro) y amplia hasta el horizonte
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) * 2.0; // -1..1
        const v = pos.getZ(i) * 2.0; // -1..1
        const r = Math.hypot(u, v);
        if (r > 1e-6) {
          const factor = 0.22 * r + 0.78 * Math.pow(r, 2.35);
          const scale = (factor / r) * half * 0.72;
          pos.setX(i, u * scale);
          pos.setZ(i, v * scale);
        }
      }
      geo.computeBoundingSphere();
      return geo;
    }

    const oceanUniforms = {
      uWaveDirAmp: { value: uWaveDirAmp },
      uWaveSteepSpeed: { value: uWaveSteepSpeed },
      uRipples: { value: uRipples },
      uWavePhase: { value: 0 },
      uTime: { value: 0 },
      uWindDir: { value: new THREE.Vector2(-0.7, -0.7) },
      uWindStrength: { value: state.wind },
      uChop: { value: state.choppiness },
      uSunDir: { value: skyUniforms.uSunDir.value },
      uSunColor: { value: new THREE.Color(0xffe1ae) },
      uSkyZenith: { value: new THREE.Color(0x1f5ca8) },
      uSkyHorizon: { value: new THREE.Color(0xf0b27a) },
      uDeepColor: { value: new THREE.Color(0x04283b) },
      uShallowColor: { value: new THREE.Color(0x0d7484) },
      uNightFactor: { value: 0.0 },
      uDuckPos: { value: new THREE.Vector3(0, 0, 0) }
    };

    const oceanMat = new THREE.ShaderMaterial({
      uniforms: oceanUniforms,
      vertexShader: /* glsl */ `
        #define NUM_WAVES 6
        #define MAX_RIPPLES 8

        uniform vec4 uWaveDirAmp[NUM_WAVES];
        uniform vec4 uWaveSteepSpeed[NUM_WAVES];
        uniform vec4 uRipples[MAX_RIPPLES];
        uniform float uWavePhase;
        uniform float uTime;

        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying float vCrestFoam;
        varying float vRippleFoam;
        varying float vSubsurface;

        void main() {
          vec3 p = position;
          vec3 tangentX = vec3(1.0, 0.0, 0.0);
          vec3 tangentZ = vec3(0.0, 0.0, 1.0);
          float jacobian = 1.0;

          for (int i = 0; i < NUM_WAVES; i++) {
            vec2 d = uWaveDirAmp[i].xy;
            float amp = uWaveDirAmp[i].z;
            float k = uWaveDirAmp[i].w;
            float q = uWaveSteepSpeed[i].x;
            float speed = uWaveSteepSpeed[i].y;

            float theta = k * dot(d, position.xz) - speed * uWavePhase;
            float c = cos(theta);
            float s = sin(theta);

            float qa = q * amp;
            p.x += qa * d.x * c;
            p.z += qa * d.y * c;
            p.y += amp * s;

            float wa = k * amp;
            float qwa = q * wa;
            jacobian -= qwa * s;

            tangentX += vec3(-qwa * d.x * d.x * s, wa * d.x * c, -qwa * d.x * d.y * s);
            tangentZ += vec3(-qwa * d.x * d.y * s, wa * d.y * c, -qwa * d.y * d.y * s);
          }

          // Ondas concéntricas interactivas (estela del pato / salpicaduras)
          float rippleFoam = 0.0;
          for (int i = 0; i < MAX_RIPPLES; i++) {
            vec4 r = uRipples[i];
            if (r.w > 0.01 && r.z < 4.5) {
              vec2 delta = p.xz - r.xy;
              float dist = length(delta);
              float ringR = r.z * 5.0;
              float band = exp(-abs(dist - ringR) * 1.45) * exp(-r.z * 1.25) * r.w;
              float wave = sin((dist - ringR) * 4.6);
              p.y += wave * 0.14 * band;

              // Perturbar tangentes sutilmente para reflejos del anillo
              vec2 rDir = dist > 0.001 ? delta / dist : vec2(1.0, 0.0);
              float slope = cos((dist - ringR) * 4.6) * 0.65 * band;
              tangentX.y += slope * rDir.x;
              tangentZ.y += slope * rDir.y;

              rippleFoam += band * (0.55 + 0.45 * max(wave, 0.0));
            }
          }

          vec3 n = normalize(cross(tangentZ, tangentX));
          vNormal = n;
          vCrestFoam = clamp((1.0 - jacobian) * 1.15 + max(p.y, 0.0) * 0.12, 0.0, 1.5);
          vRippleFoam = clamp(rippleFoam, 0.0, 1.2);
          vSubsurface = clamp(p.y * 0.45 + (1.0 - jacobian) * 0.4, 0.0, 1.0);

          vec4 worldPos = modelMatrix * vec4(p, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec2 uWindDir;
        uniform float uWindStrength;
        uniform float uChop;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform vec3 uSkyZenith;
        uniform vec3 uSkyHorizon;
        uniform vec3 uDeepColor;
        uniform vec3 uShallowColor;
        uniform float uNightFactor;
        uniform vec3 uDuckPos;

        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying float vCrestFoam;
        varying float vRippleFoam;
        varying float vSubsurface;

        float hash2(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise2(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash2(i);
          float b = hash2(i + vec2(1.0, 0.0));
          float c = hash2(i + vec2(0.0, 1.0));
          float d = hash2(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            v += a * noise2(p);
            p = rot * p * 2.05;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 viewVec = cameraPosition - vWorldPos;
          float dist = length(viewVec);
          vec3 V = viewVec / max(dist, 0.0001);

          // Micro-rizos procedurales movidos por el viento (sin aliasing lejano)
          float detailFade = exp(-dist * 0.016);
          vec2 flow1 = vWorldPos.xz * 0.85 - uWindDir * uTime * (0.4 + uWindStrength * 1.4);
          vec2 flow2 = vWorldPos.xz * 1.95 + vec2(-uWindDir.y, uWindDir.x) * uTime * (0.25 + uWindStrength * 0.9);
          float h0 = fbm(flow1) + 0.5 * fbm(flow2);
          float hx = fbm(flow1 + vec2(0.08, 0.0)) + 0.5 * fbm(flow2 + vec2(0.08, 0.0));
          float hz = fbm(flow1 + vec2(0.0, 0.08)) + 0.5 * fbm(flow2 + vec2(0.0, 0.08));

          float rippleAmp = (0.045 + uWindStrength * 0.16) * detailFade;
          vec3 microN = vec3((h0 - hx) * rippleAmp * 12.0, 1.0, (h0 - hz) * rippleAmp * 12.0);
          vec3 N = normalize(vNormal + vec3(microN.x, 0.0, microN.z));

          // Fresnel de Schlick
          float cosTheta = clamp(dot(N, V), 0.0, 1.0);
          float fresnel = 0.02 + 0.98 * pow(1.0 - cosTheta, 5.0);

          // Color de reflejo del cielo
          vec3 R = reflect(-V, N);
          float skyGrad = pow(1.0 - clamp(R.y, 0.0, 1.0), 2.4);
          vec3 skyRefl = mix(uSkyZenith, uSkyHorizon, skyGrad);

          // Color base del agua + dispersión subsuperficial (brillo turquesa en crestas)
          vec3 L = normalize(uSunDir);
          float backLight = pow(clamp(dot(V, -L + N * 0.45), 0.0, 1.0), 3.0);
          float sss = clamp(vSubsurface * (0.45 + 0.85 * backLight), 0.0, 1.0);
          vec3 waterBody = mix(uDeepColor, uShallowColor, 0.35 + 0.65 * clamp(N.y * 0.5 + 0.3, 0.0, 1.0));
          waterBody += vec3(0.05, 0.38, 0.36) * sss * (1.0 - uNightFactor * 0.78);

          vec3 col = mix(waterBody, skyRefl, clamp(fresnel * 0.92, 0.0, 0.96));

          // Destello especular del sol / luna sobre el agua
          vec3 H = normalize(L + V);
          float specPower = mix(220.0, 65.0, uWindStrength);
          float spec = pow(max(dot(N, H), 0.0), specPower);
          float glitter = pow(max(dot(N, H), 0.0), 900.0) * 2.8;
          col += uSunColor * (spec * 1.15 + glitter) * smoothstep(-0.08, 0.12, L.y);

          // Espuma en crestas, por viento fuerte, anillos de estela y contacto con el pato
          float foamTex = fbm(vWorldPos.xz * 1.35 - uWindDir * uTime * 0.55);
          float crestThreshold = mix(0.95, 0.44, clamp(uChop * 0.72 + uWindStrength * 0.45, 0.0, 1.0));
          float crestFoam = smoothstep(crestThreshold, crestThreshold + 0.35, vCrestFoam + foamTex * 0.42);

          // Anillo suave de espuma pegado al pato
          float duckDist = length(vWorldPos.xz - uDuckPos.xz);
          float duckHeightProx = 1.0 - smoothstep(0.0, 0.85, abs(uDuckPos.y - vWorldPos.y));
          float duckContact = smoothstep(0.95, 0.48, duckDist) * smoothstep(0.18, 0.45, duckDist) * duckHeightProx;

          float totalFoam = clamp(crestFoam * 0.78 + vRippleFoam * (0.55 + 0.45 * foamTex) + duckContact * 0.52, 0.0, 1.0);
          totalFoam *= exp(-dist * 0.0085);

          vec3 foamColor = mix(vec3(0.92, 0.97, 1.0), uSkyHorizon * 0.55 + vec3(0.45), 0.25);
          foamColor *= mix(1.0, 0.32, uNightFactor);
          col = mix(col, foamColor, totalFoam * 0.85);

          // Niebla atmosférica hacia el horizonte
          float fogFactor = 1.0 - exp(-pow(dist * 0.0068, 2.0));
          col = mix(col, uSkyHorizon, clamp(fogFactor, 0.0, 1.0));

          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const oceanGeo = buildOceanGeometry(380, 220);
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    scene.add(oceanMesh);

    // =========================================================
    // 7. CONSTRUCCIÓN DEL PATO DE GOMA + OBJETOS FLOTANTES
    // =========================================================
    function createRubberDuck() {
      const root = new THREE.Group();
      const visual = new THREE.Group();
      root.add(visual);

        color: 0xffd21f,

        clearcoat: 0.48,

      });

      const beakMat = new THREE.MeshPhysicalMaterial({
        color: 0xff6b14,

      });

      const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eyeDarkMat = new THREE.MeshPhysicalMaterial({
        color: 0x101418,

      });

      // Cola respingona clásica
      const tailGeo = new THREE.ConeGeometry(0.24, 0.46, 22);
      const tail = new THREE.Mesh(tailGeo, yellowMat);
      tail.rotation.x = -Math.PI * 0.36;
      tail.scale.set(1.05, 1.0, 0.72);

      // Ojos y mejillas
      [-1, 1].forEach(side => {

        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 12), blushMat);

        // Alas esculpidas a los lados
        const wingGeo = new THREE.SphereGeometry(0.28, 22, 16);
        const wing = new THREE.Mesh(wingGeo, yellowMat);
        wing.scale.set(0.32, 0.65, 1.22);
        wing.position.set(side * 0.45, 0.18, -0.06);
        wing.rotation.set(-0.18, side * 0.12, side * -0.22);
        visual.add(wing);
      });

      // Esfera invisible amplia para facilitar raycast en móvil y escritorio
      const hitMesh = new THREE.Mesh(
        new THREE.SphereGeometry(1.05, 12, 10),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          depthWrite: false,
          colorWrite: false
        })
      );
      hitMesh.position.set(0, 0.35, 0.08);
      root.add(hitMesh);

      return { root, visual, hitMesh, yellowMat };
    }

    // Objetos secundarios flotantes para evidenciar la física en toda la superficie
    function createBuoy() {
      const g = new THREE.Group();
      const redMat = new THREE.MeshStandardMaterial({ color: 0xd93829, roughness: 0.48, metalness: 0.1 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf4f6f8, roughness: 0.45 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x242c35, roughness: 0.6, metalness: 0.3 });
      const beaconMat = new THREE.MeshStandardMaterial({
        color: 0xffd27a,
        emissive: 0xff9820,
        emissiveIntensity: 1.6
      });

      const floatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.48, 0.55, 20), redMat);
      floatBase.position.y = 0.0;
      g.add(floatBase);

      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.16, 20), whiteMat);
      band.position.y = 0.08;
      g.add(band);

      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.34, 0.85, 14), darkMat);
      tower.position.y = 0.65;
      g.add(tower);

      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.10, 14), redMat);
      cap.position.y = 1.08;
      g.add(cap);

      const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 12), beaconMat);
      beacon.position.y = 1.22;
      g.add(beacon);

      return { mesh: g, beaconMat };
    }

    function createLifeRing() {
      const g = new THREE.Group();
      const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff5a1f, roughness: 0.42 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf6f8fa, roughness: 0.45 });

      const torus = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.15, 16, 32), orangeMat);
      torus.rotation.x = Math.PI / 2;
      g.add(torus);

      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2;
        const stripe = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.158, 12, 10, 0.42), whiteMat);
        stripe.rotation.x = Math.PI / 2;
        stripe.rotation.z = angle - 0.21;
        g.add(stripe);
      }
      return g;
    }

    const duckObj = createRubberDuck();
    scene.add(duckObj.root);

    const buoyObj = createBuoy();
    scene.add(buoyObj.mesh);

    const lifeRingMesh = createLifeRing();
    scene.add(lifeRingMesh);

    // =========================================================
    // 8. PARTÍCULAS 3D DE SALPICADURAS
    // =========================================================
    const MAX_DROPS = 90;
    const dropPos = new Float32Array(MAX_DROPS * 3);
    const dropVel = new Float32Array(MAX_DROPS * 3);
    const dropLife = new Float32Array(MAX_DROPS);

    const dropGeo = new THREE.BufferGeometry();
    dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));

    const dropMat = new THREE.PointsMaterial({
      color: 0xeaf8ff,
      size: 0.16,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    });
    const dropPoints = new THREE.Points(dropGeo, dropMat);
    dropPoints.frustumCulled = false;
    scene.add(dropPoints);

    let dropCursor = 0;
    function spawnSplashDrops(x, y, z, count = 18, power = 1.0) {
      for (let i = 0; i < count; i++) {
        const idx = dropCursor;
        dropCursor = (dropCursor + 1) % MAX_DROPS;
        const a = Math.random() * Math.PI * 2;
        const spd = (1.1 + Math.random() * 2.4) * power;
        dropPos[idx * 3] = x + Math.cos(a) * 0.35;
        dropPos[idx * 3 + 1] = y + 0.12;
        dropPos[idx * 3 + 2] = z + Math.sin(a) * 0.35;

        dropVel[idx * 3] = Math.cos(a) * spd;
        dropVel[idx * 3 + 1] = (2.1 + Math.random() * 2.6) * power;
        dropVel[idx * 3 + 2] = Math.sin(a) * spd;
        dropLife[idx] = 0.65 + Math.random() * 0.45;
      }
    }

    function updateSplashDrops(dt) {
      for (let i = 0; i < MAX_DROPS; i++) {
        if (dropLife[i] <= 0) {
          dropPos[i * 3 + 1] = -999;
          continue;
        }
        dropLife[i] -= dt;
        dropVel[i * 3 + 1] -= 9.81 * dt;
        dropPos[i * 3] += dropVel[i * 3] * dt;
        dropPos[i * 3 + 1] += dropVel[i * 3 + 1] * dt;
        dropPos[i * 3 + 2] += dropVel[i * 3 + 2] * dt;
      }
      dropGeo.attributes.position.needsUpdate = true;
    }

    // =========================================================
    // 9. FÍSICA DE FLOTACIÓN REAL (6-DOF MULTI-PUNTO)
    // =========================================================
    class FloatingBody {
      constructor({ mesh, pos, radius = 0.6, draft = 0.26, buoyancy = 26.0, righting = 9.5, home = null, tetherRadius = 14 }) {
        this.mesh = mesh;
        this.pos = pos.clone();
        this.vel = new THREE.Vector3();
        this.quat = new THREE.Quaternion();
        this.angVel = new THREE.Vector3(); // pitch(x), yaw(y), roll(z) en espacio mundo
        this.radius = radius;
        this.draft = draft;
        this.buoyancy = buoyancy;
        this.righting = righting;
        this.home = home ? home.clone() : pos.clone();
        this.tetherRadius = tetherRadius;
        this.wasInWater = true;
        this.dragTrailTimer = 0;

        // 4 puntos cardinales en el casco local para calcular cabeceo y escora reales
        this.hullPoints = [
          new THREE.Vector3(0, 0, radius),
          new THREE.Vector3(0, 0, -radius),
          new THREE.Vector3(radius * 0.82, 0, 0),
          new THREE.Vector3(-radius * 0.82, 0, 0)
        ];
      }

      step(dt, phase, isDragged = false, dragTarget = null, emitSplash = false) {
        const g = 9.81;
        const centerSurf = sampleOceanSurface(this.pos.x, this.pos.z, phase);

        // Muestreamos los 4 puntos del casco para obtener flotabilidad y momentos reales
        let submergedAvg = 0;
        const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(this.quat);
        const torque = new THREE.Vector3();
        const wp = new THREE.Vector3();
        const lever = new THREE.Vector3();

        for (let i = 0; i < this.hullPoints.length; i++) {
          wp.copy(this.hullPoints[i]).applyQuaternion(this.quat).add(this.pos);
          const s = sampleOceanSurface(wp.x, wp.z, phase);
          const depth = Math.max(0, s.y + this.draft - wp.y);
          const normSub = Math.min(1.8, depth / (this.draft * 2.0));
          submergedAvg += normSub * 0.25;

          // Par de flotación = brazo x fuerza vertical en el punto del casco
          lever.copy(wp).sub(this.pos);
          const upForce = normSub * this.buoyancy * 0.25;
          torque.x -= lever.z * upForce * 1.15;
          torque.z += lever.x * upForce * 1.15;
        }

        const inWater = submergedAvg > 0.02;

        // Detectar chapuzón al entrar al agua desde un salto
        if (emitSplash && inWater && !this.wasInWater && this.vel.y < -1.4) {
          const strength = Math.min(1.4, Math.abs(this.vel.y) * 0.24);
          spawnRipple(this.pos.x, this.pos.z, strength);
          spawnSplashDrops(this.pos.x, centerSurf.y, this.pos.z, 20, 0.7 + strength * 0.45);
          sound.playSplash(strength);
        }
        this.wasInWater = inWater;

        // Fuerza vertical: gravedad + empuje de Arquímedes
        const fy = -g + submergedAvg * this.buoyancy;
        this.vel.y += fy * dt;

        // Arrastre hidrodinámico y deriva por viento/oleaje
        const windRad = (state.windAngleDeg * Math.PI) / 180;
        const windX = Math.cos(windRad);
        const windZ = Math.sin(windRad);

        if (inWater) {
          // Agua frena fuerte la velocidad relativa respecto al movimiento orbital del agua
          const relVx = this.vel.x - (centerSurf.vx * 0.45 + windX * state.wind * 0.65);
          const relVz = this.vel.z - (centerSurf.vz * 0.45 + windZ * state.wind * 0.65);
          const dragXZ = Math.exp(-2.6 * submergedAvg * dt);
          this.vel.x = (this.vel.x - relVx * (1 - dragXZ));
          this.vel.z = (this.vel.z - relVz * (1 - dragXZ));
          this.vel.y *= Math.exp(-3.8 * submergedAvg * dt);
        } else {
          this.vel.multiplyScalar(Math.exp(-0.25 * dt));
        }

        // Si el usuario arrastra el pato, aplicamos un muelle físico suave hacia el cursor
        if (isDragged && dragTarget) {
          const kSpring = 38.0;
          const kDamp = 9.5;
          const targetY = Math.max(centerSurf.y + 0.15, dragTarget.y);
          this.vel.x += ((dragTarget.x - this.pos.x) * kSpring - this.vel.x * kDamp) * dt;
          this.vel.y += ((targetY - this.pos.y) * 44.0 - this.vel.y * 10.5) * dt;
          this.vel.z += ((dragTarget.z - this.pos.z) * kSpring - this.vel.z * kDamp) * dt;

          // El pato se inclina ligeramente hacia donde lo arrastras y gira suavemente su rumbo
          const speedXZ = Math.hypot(this.vel.x, this.vel.z);
          if (speedXZ > 0.35) {
            const desiredForward = new THREE.Vector3(this.vel.x, 0, this.vel.z).normalize();
            const curForward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.quat);
            curForward.y = 0;
            if (curForward.lengthSq() > 0.001) {
              curForward.normalize();
              const crossY = curForward.z * desiredForward.x - curForward.x * desiredForward.z;
              this.angVel.y += crossY * 6.0 * dt;
            }
          }

          // Estela de agua continua mientras se arrastra sobre las olas
          this.dragTrailTimer += dt;
          if (this.dragTrailTimer > 0.09 && Math.abs(this.pos.y - centerSurf.y) < 0.75) {
            const spd = Math.hypot(this.vel.x, this.vel.z);
            if (spd > 0.8) {
              spawnRipple(this.pos.x, this.pos.z, Math.min(0.85, spd * 0.08));
              this.dragTrailTimer = 0;
            }
          }
        } else {
          // Fuerza suave de retorno si la deriva del viento lo aleja demasiado de la zona visible
          const dxHome = this.home.x - this.pos.x;
          const dzHome = this.home.z - this.pos.z;
          const distHome = Math.hypot(dxHome, dzHome);
          if (distHome > this.tetherRadius) {
            const pull = (distHome - this.tetherRadius) * 0.45;
            this.vel.x += (dxHome / distHome) * pull * dt;
            this.vel.z += (dzHome / distHome) * pull * dt;
          }
        }

        // Integración de posición
        this.pos.addScaledVector(this.vel, dt);

        // Par de adrizamiento hacia la normal de la ola (cuando está en el agua) o vertical suave en el aire
        const surfNormal = new THREE.Vector3(centerSurf.nx, centerSurf.ny, centerSurf.nz);
        const targetUp = inWater
          ? surfNormal.lerp(new THREE.Vector3(0, 1, 0), 0.16).normalize()
          : new THREE.Vector3(0, 1, 0);

        const alignAxis = new THREE.Vector3().crossVectors(localUp, targetUp);
        const rightingGain = inWater ? this.righting : 2.2;
        this.angVel.x += (alignAxis.x * rightingGain + torque.x * 0.45) * dt;
        this.angVel.z += (alignAxis.z * rightingGain + torque.z * 0.45) * dt;

        // Amortiguación angular realista (agua frena el balanceo rápido)
        const angDampXZ = inWater ? Math.exp(-4.6 * dt) : Math.exp(-1.1 * dt);
        const angDampY = inWater ? Math.exp(-2.1 * dt) : Math.exp(-0.5 * dt);
        this.angVel.x *= angDampXZ;
        this.angVel.z *= angDampXZ;
        this.angVel.y *= angDampY;

        // Aplicar rotación incremental
        const angSpeed = this.angVel.length();
        if (angSpeed > 1e-5) {
          const axis = this.angVel.clone().divideScalar(angSpeed);
          const dq = new THREE.Quaternion().setFromAxisAngle(axis, angSpeed * dt);
          this.quat.premultiply(dq).normalize();
        }

        this.mesh.position.copy(this.pos);
        this.mesh.quaternion.copy(this.quat);
      }
    }

    const duckBody = new FloatingBody({
      mesh: duckObj.root,
      pos: new THREE.Vector3(0, 0.25, 0),
      radius: 0.56,
      draft: 0.21,
      buoyancy: 30.0,
      righting: 11.0,
      home: new THREE.Vector3(0, 0, 0),
      tetherRadius: 11.0
    });

    const buoyBody = new FloatingBody({
      mesh: buoyObj.mesh,
      pos: new THREE.Vector3(-7.8, 0.2, -5.8),
      radius: 0.52,
      draft: 0.28,
      buoyancy: 25.0,
      righting: 8.5,
      home: new THREE.Vector3(-7.8, 0, -5.8),
      tetherRadius: 6.0
    });

    const ringBody = new FloatingBody({
      mesh: lifeRingMesh,
      pos: new THREE.Vector3(6.4, 0.15, -4.4),
      radius: 0.52,
      draft: 0.12,
      buoyancy: 32.0,
      righting: 13.5,
      home: new THREE.Vector3(6.4, 0, -4.4),
      tetherRadius: 6.0
    });

    // =========================================================
    // 10. INTERACCIÓN CON EL PATO (RATÓN Y TÁCTIL SIN ROMPER CÁMARA)
    // =========================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.35);
    const dragIntersect = new THREE.Vector3();

    const interaction = {
      hovered: false,
      dragging: false,
      activePointerId: null,
      downTime: 0,
      downX: 0,
      downY: 0,
      movedDist: 0,
      dragTarget: new THREE.Vector3(),
      squash: 0,         // animación elástica al pulsar/soltar
      hoverBlend: 0
    };

    function setPointerNDC(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    function raycastDuck(clientX, clientY) {
      setPointerNDC(clientX, clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObject(duckObj.hitMesh, false);
      return hits.length > 0;
    }

    function triggerDuckJump() {
      const surf = sampleOceanSurface(duckBody.pos.x, duckBody.pos.z, state.wavePhase);
      const waveBoost = Math.max(0, surf.vy * 0.35);
      duckBody.vel.y = Math.max(duckBody.vel.y, 0) + 5.6 + waveBoost;

      // Impulso lateral coherente con la pendiente de la ola + giro juguetón
      duckBody.vel.x += surf.nx * 2.2 + (Math.random() - 0.5) * 1.4;
      duckBody.vel.z += surf.nz * 2.2 + (Math.random() - 0.5) * 1.4;
      duckBody.angVel.y += (Math.random() > 0.5 ? 1 : -1) * (6.8 + Math.random() * 2.5);
      duckBody.angVel.x += (Math.random() - 0.5) * 3.5;

      interaction.squash = 1.0;
      spawnRipple(duckBody.pos.x, duckBody.pos.z, 1.15);
      spawnSplashDrops(duckBody.pos.x, surf.y, duckBody.pos.z, 24, 1.0);
      sound.playSqueak();
      sound.playSplash(0.95);
    }

    renderer.domElement.addEventListener('pointerdown', e => {
      hintPill.classList.add('hidden');
      if (interaction.activePointerId !== null) return;

      const hit = raycastDuck(e.clientX, e.clientY);
      if (hit) {
        interaction.activePointerId = e.pointerId;
        interaction.dragging = true;
        interaction.downTime = performance.now();
        interaction.downX = e.clientX;
        interaction.downY = e.clientY;
        interaction.movedDist = 0;

        controls.enabled = false;
        renderer.domElement.style.cursor = 'grabbing';
        try {
          renderer.domElement.setPointerCapture(e.pointerId);
        } catch (_) {}

        // Plano horizontal dinámico a la altura actual del pato
        dragPlane.set(new THREE.Vector3(0, 1, 0), -(duckBody.pos.y + 0.15));
        if (raycaster.ray.intersectPlane(dragPlane, dragIntersect)) {
          // Limitar rango de arrastre para no perder el pato en el horizonte
          const len = Math.hypot(dragIntersect.x, dragIntersect.z);
          if (len > 18) {
            dragIntersect.x *= 18 / len;
            dragIntersect.z *= 18 / len;
          }
          interaction.dragTarget.copy(dragIntersect);
        } else {
          interaction.dragTarget.copy(duckBody.pos);
        }
        interaction.squash = 0.55;
      }
    });

    renderer.domElement.addEventListener('pointermove', e => {
      if (interaction.dragging && e.pointerId === interaction.activePointerId) {
        interaction.movedDist = Math.max(
          interaction.movedDist,
          Math.hypot(e.clientX - interaction.downX, e.clientY - interaction.downY)
        );

        setPointerNDC(e.clientX, e.clientY);
        raycaster.setFromCamera(pointerNDC, camera);
        if (raycaster.ray.intersectPlane(dragPlane, dragIntersect)) {
          const len = Math.hypot(dragIntersect.x, dragIntersect.z);
          if (len > 18) {
            dragIntersect.x *= 18 / len;
            dragIntersect.z *= 18 / len;
          }
          interaction.dragTarget.copy(dragIntersect);
        }
        return;
      }

      // Hover solo para ratón/stylus
      if (e.pointerType !== 'touch') {
        const hit = raycastDuck(e.clientX, e.clientY);
        if (hit !== interaction.hovered) {
          interaction.hovered = hit;
          renderer.domElement.style.cursor = hit ? 'grab' : 'default';
          if (hit) {
            // Pequeño cabeceo atento al pasar el cursor por encima
            duckBody.angVel.z += (Math.random() > 0.5 ? 1 : -1) * 1.4;
          }
        }
      }
    });

    function endDuckPointer(e) {
      if (!interaction.dragging || e.pointerId !== interaction.activePointerId) return;
      const dtClick = performance.now() - interaction.downTime;
      const wasTap = interaction.movedDist < 11 && dtClick < 320;

      interaction.dragging = false;
      interaction.activePointerId = null;
      controls.enabled = true;
      renderer.domElement.style.cursor = interaction.hovered ? 'grab' : 'default';
      try {
        renderer.domElement.releasePointerCapture(e.pointerId);
      } catch (_) {}

      if (wasTap) {
        triggerDuckJump();
      }
    }

    renderer.domElement.addEventListener('pointerup', endDuckPointer);
    renderer.domElement.addEventListener('pointercancel', endDuckPointer);

    // Botón para centrar pato y cámara cómodamente
    btnCenter.addEventListener('click', () => {
      duckBody.pos.set(0, sampleOceanSurface(0, 0, state.wavePhase).y + 0.5, 0);
      duckBody.vel.set(0, 0.8, 0);
      duckBody.angVel.set(0, 2.0, 0);
      spawnRipple(0, 0, 0.9);
      controls.target.set(0, 0.45, 0);
      camera.position.set(5.4, 3.3, 7.6);
      controls.update();
    });

    // =========================================================
    // 11. ATMÓSFERA SEGÚN LA HORA DEL DÍA
    // =========================================================
    const cZenithDay = new THREE.Color(0x1f62b8);
    const cZenithSunset = new THREE.Color(0x1b2b58);
    const cZenithNight = new THREE.Color(0x050b18);

    const cHorizonDay = new THREE.Color(0x9ad8f8);
    const cHorizonSunset = new THREE.Color(0xf4975c);
    const cHorizonNight = new THREE.Color(0x102138);

    const cSunDay = new THREE.Color(0xfff6e0);
    const cSunSunset = new THREE.Color(0xff9b48);
    const cSunNight = new THREE.Color(0xaec8ff);

    const cDeepDay = new THREE.Color(0x042b42);
    const cDeepSunset = new THREE.Color(0x071d30);
    const cDeepNight = new THREE.Color(0x020c18);

    const cShallowDay = new THREE.Color(0x0e8594);
    const cShallowSunset = new THREE.Color(0x0c4f61);
    const cShallowNight = new THREE.Color(0x062536);

    function updateAtmosphere() {
      const t = state.timeOfDay;
      // Ángulo solar: mediodía en t=0.5, amanecer ~0.25, atardecer ~0.75
      const sunAngle = (t - 0.25) * Math.PI * 2;
      const sunElev = Math.sin(sunAngle);
      const sunAzim = (t - 0.5) * Math.PI * 0.95 - 0.4;

      const isNight = sunElev < -0.05;
      const nightFactor = THREE.MathUtils.smoothstep(-sunElev, -0.05, 0.35);

      // En la noche usamos la luna en dirección opuesta/alta para iluminar el agua
      const activeElev = isNight ? Math.max(0.18, -sunElev * 0.7) : Math.max(0.03, sunElev);
      const dir = new THREE.Vector3(
        Math.cos(sunAzim) * Math.cos(activeElev * 1.15),
        Math.sin(activeElev * 1.15),
        Math.sin(sunAzim) * Math.cos(activeElev * 1.15) - 0.35
      ).normalize();

      skyUniforms.uSunDir.value.copy(dir);
      skyUniforms.uNightFactor.value = nightFactor;

      // Mezcla suave Día <-> Atardecer/Amanecer <-> Noche
      const twilight = Math.exp(-Math.pow(sunElev * 4.5, 2.0));
      const dayFactor = THREE.MathUtils.clamp((sunElev + 0.05) * 2.2, 0, 1);

      const zenith = cZenithNight.clone()
        .lerp(cZenithSunset, twilight)
        .lerp(cZenithDay, dayFactor * (1 - twilight * 0.55));
      const horizon = cHorizonNight.clone()
        .lerp(cHorizonSunset, twilight)
        .lerp(cHorizonDay, dayFactor * (1 - twilight * 0.72));
      const sunCol = cSunNight.clone()
        .lerp(cSunSunset, twilight)
        .lerp(cSunDay, dayFactor * (1 - twilight * 0.65));

      skyUniforms.uZenithColor.value.copy(zenith);
      skyUniforms.uHorizonColor.value.copy(horizon);
      skyUniforms.uSunColor.value.copy(sunCol);

      oceanUniforms.uSkyZenith.value.copy(zenith);
      oceanUniforms.uSkyHorizon.value.copy(horizon);
      oceanUniforms.uSunColor.value.copy(sunCol);
      oceanUniforms.uNightFactor.value = nightFactor;

      oceanUniforms.uDeepColor.value.copy(cDeepNight).lerp(cDeepSunset, twilight).lerp(cDeepDay, dayFactor);
      oceanUniforms.uShallowColor.value.copy(cShallowNight).lerp(cShallowSunset, twilight).lerp(cShallowDay, dayFactor);

      sunLight.position.copy(dir).multiplyScalar(40);
      sunLight.color.copy(sunCol);
      sunLight.intensity = THREE.MathUtils.lerp(2.9, 0.75, nightFactor) * (0.75 + 0.25 * dayFactor);

      hemiLight.color.copy(horizon).lerp(zenith, 0.4);
      hemiLight.groundColor.copy(oceanUniforms.uShallowColor.value);
      hemiLight.intensity = THREE.MathUtils.lerp(0.95, 0.38, nightFactor);

      rimFill.intensity = THREE.MathUtils.lerp(0.45, 0.28, nightFactor);
      buoyObj.beaconMat.emissiveIntensity = 0.6 + nightFactor * 2.8;
    }

    updateAtmosphere();

    // =========================================================
    // 12. REDIMENSIONADO Y BUCLE PRINCIPAL
    // =========================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      state.elapsed += dt;
      // Acumulador de fase continuo: cambiar viento no salta el agua
      state.wavePhase += dt * (0.62 + state.wind * 1.18);

      updateWaveParameters();

      // Actualizar anillos de estela / salpicadura
      for (let i = 0; i < MAX_RIPPLES; i++) {
        const r = ripples[i];
        if (r.active) {
          r.age += dt;
          if (r.age > 4.2) {
            r.active = false;
            uRipples[i].set(0, 0, 99, 0);
          } else {
            uRipples[i].set(r.x, r.z, r.age, r.strength);
          }
        }
      }

      // Actualizar uniforms de océano y cielo
      const windRad = (state.windAngleDeg * Math.PI) / 180;
      oceanUniforms.uWavePhase.value = state.wavePhase;
      oceanUniforms.uTime.value = state.elapsed;
      oceanUniforms.uWindDir.value.set(Math.cos(windRad), Math.sin(windRad));
      oceanUniforms.uWindStrength.value = state.wind;
      oceanUniforms.uChop.value = state.choppiness;
      skyUniforms.uTime.value = state.elapsed;

      // Paso de física real (2 substeps para estabilidad total incluso con olas altas)
      const subSteps = 2;
      const subDt = dt / subSteps;
      for (let s = 0; s < subSteps; s++) {
        duckBody.step(subDt, state.wavePhase, interaction.dragging, interaction.dragTarget, true);
        buoyBody.step(subDt, state.wavePhase, false, null, false);
        ringBody.step(subDt, state.wavePhase, false, null, false);
      }

      oceanUniforms.uDuckPos.value.copy(duckBody.pos);

      // Parpadeo sutil de la baliza de la boya
      const blink = 0.55 + 0.45 * Math.sin(state.elapsed * 3.6);
      buoyObj.beaconMat.emissiveIntensity = (0.5 + oceanUniforms.uNightFactor.value * 2.8) * blink;

      // Animación visual elástica (hover + salto) sobre duckObj.visual
      interaction.squash = Math.max(0, interaction.squash - dt * 3.4);
      const targetHover = interaction.hovered && !interaction.dragging ? 1 : 0;
      interaction.hoverBlend += (targetHover - interaction.hoverBlend) * Math.min(1, dt * 10);

      const bounce = Math.sin(interaction.squash * Math.PI * 2.0) * interaction.squash * 0.16;
      const hoverScale = 1.0 + interaction.hoverBlend * 0.045;
      duckObj.visual.scale.set(
        hoverScale * (1.0 - bounce * 0.6),
        hoverScale * (1.0 + bounce),
        hoverScale * (1.0 - bounce * 0.6)
      );
      duckObj.yellowMat.emissive.setRGB(
        0.10 * interaction.hoverBlend,
        0.07 * interaction.hoverBlend,
        0.0
      );

      updateSplashDrops(dt);
      sound.update(state.wind, state.waveHeight);

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
